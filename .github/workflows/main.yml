name: Daily Steam Top Sellers Alert

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

# Permissions required for committing archives and deploying to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Steam Alerts Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python steam_alerts.py

      - name: Commit and push archives
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily Steam report and archives"
          file_pattern: 'index.html archive/* data/*'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d "archive" ]; then cp -r archive _site/; fi
          if [ -d "data" ]; then cp -r data _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
