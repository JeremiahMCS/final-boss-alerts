name: Daily Steam Top Sellers Alert

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch: 

# We must grant the action permission to write files back to the repository
permissions:
  contents: write

jobs:
  run-steam-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Steam Alerts Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python steam_alerts.py

      # This new step commits the generated index.html file back to your repo
      - name: Commit and push HTML file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily Steam report HTML"
          file_pattern: 'index.html'
